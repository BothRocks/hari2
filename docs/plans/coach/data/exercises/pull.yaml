- slug: seal_row_barra
  nombre: Seal row con barra
  patrones: [pull_horizontal]
  equipamiento: [barra, banco_elevado]
  lugares: [gimnasio]
  tipo_carga: externa
  doms_risk: 2
  estres_articular: {hombro: 1, lumbar: 0, codo: 1}
  skill: 1
  rango_reps: [8, 12]
  descanso_seg: 90
  familia: remo
  cues: ["Tira con el codo, no con la mano", "Sin impulso: el pecho no se despega"]
  cues_siempre: ["Respira por repetición: aire abajo, suelta al bajar"]

