# power · agility — Prioridad alta a los 54: la potencia es lo primero que se pierde.
# Los olímpicos son casi puramente concéntricos: exigentes pero de daño muscular bajo.

- slug: hang_power_clean
  nombre: Hang power clean
  patrones: [power, hinge]
  equipamiento: [barra, discos]
  lugares: [gimnasio]
  tipo_carga: externa
  doms_risk: 2
  estres_articular: {muneca: 2, hombro: 1, lumbar: 1}
  skill: 3
  es_potencia: true
  rango_reps: [1, 3]
  descanso_seg: 150
  familia: clean
  progresion_a: [power_clean]
  tipo_progresion: olimpico
  cues: ["Codos rápidos", "Recepción alta, no busques el fondo"]
  cues_siempre: ["Para cuando pierdas velocidad de barra, aunque queden series"]

