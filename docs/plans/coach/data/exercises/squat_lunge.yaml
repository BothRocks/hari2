# squat · lunge — Base. Ojo: zancadas caminando y búlgaras son productoras notorias de agujetas.

- slug: front_squat_barra
  nombre: Front squat con barra
  patrones: [squat, core_antiext]
  equipamiento: [barra, rack, discos]
  lugares: [gimnasio]
  tipo_carga: externa
  doms_risk: 3
  estres_articular: {rodilla: 2, lumbar: 1, muneca: 2}
  skill: 3
  rango_reps: [5, 8]
  descanso_seg: 180
  familia: sentadilla
  cues: ["Codos altos, torso vertical", "Rodillas hacia fuera"]

- slug: goblet_squat
  nombre: Goblet squat con kettlebell
  patrones: [squat, mobility]
