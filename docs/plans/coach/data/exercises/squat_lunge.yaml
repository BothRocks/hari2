  tipo_carga: externa
  doms_risk: 2
  estres_articular: {rodilla: 1, lumbar: 0}
  skill: 1
  rango_reps: [8, 12]
  descanso_seg: 90
  familia: sentadilla
  progresion_a: [front_squat_barra]
  cues: ["Codos dentro de las rodillas abajo", "Pausa 1 s en el fondo"]

